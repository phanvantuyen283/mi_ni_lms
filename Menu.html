<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Môn Học</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        #security-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f1f5f9; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .lock-box {
            background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;
            width: 90%; max-width: 350px; border: 1px solid #cbd5e1;
        }
        .lock-input {
            width: 80%; padding: 12px; margin: 15px 0;
            border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; outline: none;
            text-align: center; letter-spacing: 2px;
        }
        .lock-input:focus { border-color: #0284c7; }
        .lock-btn {
            background: #0284c7; color: white; border: none; padding: 12px 30px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;
            box-shadow: 0 4px 0 #0369a1; transition: 0.2s;
        }
        .lock-btn:active { transform: translateY(4px); box-shadow: none; }
        .error-text { color: #ef4444; margin-top: 10px; font-size: 14px; display: none; font-weight: bold;}
    </style>
</head>
<body>

    <div id="security-overlay">
        <div class="lock-box">
            <h2 style="color: #0284c7; text-transform: uppercase; margin-top: 0;">🔒 BẢO MẬT</h2>
            <p style="color: #64748b; margin-bottom: 10px;">Nhập mã khóa để mở Menu</p>
            <input type="number" id="pass-input" class="lock-input" placeholder="Nhập mã số..." pattern="\d*">
            <br>
            <button onclick="checkSecurity()" class="lock-btn">MỞ KHÓA</button>
            <p id="pass-error" class="error-text">Sai mật khẩu!</p>
        </div>
    </div>

    <div class="quiz-container">
        <h2 style="color: #0284c7; text-transform: uppercase; margin-bottom: 5px;">Thời Khóa Biểu</h2>
        <p style="color: #64748b; margin-bottom: 20px;">Xin chào, <span id="student-name" style="font-weight:900; color:#ea580c; font-size: 1.2rem">...</span> 👋</p>
        
        <div id="loading" style="color:#0284c7; font-weight:bold; margin:20px;">⏳ Đang tải bài học hôm nay...</div>

        <div class="menu-grid" id="menu-grid" style="display: none;">
            
            <a href="Bai_Toan.html" class="subject-card" id="btn-toan"><span style="font-size: 2rem;">📐</span><br>TOÁN</a>
            <a href="Bai_Tieng_Viet.html" class="subject-card" id="btn-tv"><span style="font-size: 2rem;">📖</span><br>TIẾNG VIỆT</a>
            <a href="Bai_Su_Dia.html" class="subject-card" id="btn-sudia"><span style="font-size: 2rem;">🌍</span><br>SỬ - ĐỊA</a>
            <a href="Bai_Khoa_Hoc.html" class="subject-card" id="btn-khoa"><span style="font-size: 2rem;">⚗️</span><br>KHOA HỌC</a>

            <a href="Bai_Dao_Duc.html" class="subject-card" id="btn-daoduc"><span style="font-size: 2rem;">💖</span><br>ĐẠO ĐỨC</a>
            <a href="Bai_Cong_Nghe.html" class="subject-card" id="btn-congnghe"><span style="font-size: 2rem;">🛠</span><br>CÔNG NGHỆ</a>
            <a href="Bai_My_Thuat.html" class="subject-card" id="btn-mythuat"><span style="font-size: 2rem;">🎨</span><br>MỸ THUẬT</a>
            <a href="Bai_HD_Trai_Nghiem.html" class="subject-card" id="btn-hdtnghiem"><span style="font-size: 2rem;">🌱</span><br>TRẢI NGHIỆM</a>

        </div>

        <button onclick="logout()" style="margin-top: 30px; background: #e2e8f0; color: #64748b; box-shadow: 0 4px 0 #cbd5e1;">⬅ Đăng xuất</button>
    </div>

    <script>
        // --- CẤU HÌNH MẬT KHẨU TẠI ĐÂY ---
        const MAT_KHAU_HE_THONG = "123456"; // Anh sửa số này theo ý thích

        function checkSecurity() {
            const input = document.getElementById("pass-input").value;
            const overlay = document.getElementById("security-overlay");
            const errorMsg = document.getElementById("pass-error");

            if (input === MAT_KHAU_HE_THONG) {
                // Nếu đúng: Ẩn màn hình khóa đi
                overlay.style.display = "none";
                // Lưu trạng thái đã mở khóa (để F5 không bị hỏi lại - nếu anh muốn luôn hỏi thì xóa dòng dưới)
                sessionStorage.setItem("daMoKhoaMenu", "true");
            } else {
                // Nếu sai: Hiện lỗi
                errorMsg.style.display = "block";
                document.getElementById("pass-input").value = ""; // Xóa ô nhập
            }
        }

        // Tự động kiểm tra nếu đã nhập đúng trước đó (tránh hỏi lại khi tải lại trang)
        if(sessionStorage.getItem("daMoKhoaMenu") === "true") {
            document.getElementById("security-overlay").style.display = "none";
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyA77lLi_JCLIdR535KEfg3S0_Ge2EorPMo", authDomain: "baikiemtracuoiki.firebaseapp.com", projectId: "baikiemtracuoiki", storageBucket: "baikiemtracuoiki.firebasestorage.app", messagingSenderId: "953819948776", appId: "1:953819948776:web:4e9a017a6c5fc10ed28b5d" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const name = localStorage.getItem("hocSinhLop4A");
        if(name) document.getElementById("student-name").innerText = name;
        else window.location.href = "index.html";

        window.logout = function() {
            localStorage.removeItem("hocSinhLop4A");
            // Xóa luôn trạng thái mở khóa khi đăng xuất
            sessionStorage.removeItem("daMoKhoaMenu"); 
            window.location.href = "index.html";
        }

        async function checkMonHoc() {
            try {
                const docSnap = await getDoc(doc(db, "CAU_HINH", "trang_thai_mon"));
                document.getElementById("loading").style.display = "none";
                document.getElementById("menu-grid").style.display = "grid";

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if(!data.toan) document.getElementById("btn-toan").style.display = "none";
                    if(!data.tv) document.getElementById("btn-tv").style.display = "none";
                    if(!data.sudia) document.getElementById("btn-sudia").style.display = "none";
                    if(!data.khoa) document.getElementById("btn-khoa").style.display = "none";
                    
                    // Check 4 môn mới
                    if(!data.daoduc) document.getElementById("btn-daoduc").style.display = "none";
                    if(!data.congnghe) document.getElementById("btn-congnghe").style.display = "none";
                    if(!data.mythuat) document.getElementById("btn-mythuat").style.display = "none";
                    if(!data.hdtnghiem) document.getElementById("btn-hdtnghiem").style.display = "none";
                }
            } catch (e) {
                console.error("Lỗi:", e);
                document.getElementById("loading").style.display = "none";
                document.getElementById("menu-grid").style.display = "grid";
            }
        }
        checkMonHoc();
    </script>
</body>
</html>
