<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Môn Học</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="quiz-container">
        <h2 style="color: #0284c7; margin-bottom: 5px;">THỜI KHÓA BIỂU</h2>
        <p style="color: #64748b; margin-bottom: 20px;">Xin chào, <span id="student-name" style="font-weight:900; color:#ea580c; font-size: 1.2rem">...</span> 👋</p>
        
        <div id="loading" style="color:#0284c7; font-weight:bold; margin:20px;">⏳ Đang tải bài học hôm nay...</div>

        <div class="menu-grid" id="menu-grid" style="display: none;">
            <a href="Bai_Toan.html" class="subject-card" id="btn-toan"><span style="font-size: 2rem;">📐</span><br>TOÁN</a>
            <a href="Bai_Tieng_Viet.html" class="subject-card" id="btn-tv"><span style="font-size: 2rem;">📖</span><br>TIẾNG VIỆT</a>
            <a href="Bai_Su_Dia.html" class="subject-card" id="btn-sudia"><span style="font-size: 2rem;">🌍</span><br>SỬ - ĐỊA</a>
            <a href="Bai_Khoa_Hoc.html" class="subject-card" id="btn-khoa"><span style="font-size: 2rem;">⚗️</span><br>KHOA HỌC</a>
            <a href="Bai_Dao_Duc.html" class="subject-card" id="btn-daoduc"><span style="font-size: 2rem;">💖</span><br>ĐẠO ĐỨC</a>
            <a href="Bai_Cong_Nghe.html" class="subject-card" id="btn-congnghe"><span style="font-size: 2rem;">🛠</span><br>CÔNG NGHỆ</a>
            <a href="Bai_My_Thuat.html" class="subject-card" id="btn-mythuat"><span style="font-size: 2rem;">🎨</span><br>MỸ THUẬT</a>
            <a href="Bai_HD_Trai_Nghiem.html" class="subject-card" id="btn-hdtnghiem"><span style="font-size: 2rem;">🌱</span><br>TRẢI NGHIỆM</a>
        </div>

        <button onclick="logout()" style="margin-top: 30px; background: #e2e8f0; color: #64748b; box-shadow: 0 4px 0 #cbd5e1;">⬅ Đăng xuất</button>
    </div>

    <script src="config.js"></script>

    <script>
        const name = localStorage.getItem("hocSinhLop4A");
        if(name) document.getElementById("student-name").innerText = name;
        else window.location.href = "index.html";

        window.logout = function() {
            localStorage.removeItem("hocSinhLop4A");
            window.location.href = "index.html";
        }

        async function checkMonHoc() {
            try {
                // db đã có từ config.js
                const docSnap = await db.collection("CAU_HINH").doc("trang_thai_mon").get();
                document.getElementById("loading").style.display = "none";
                document.getElementById("menu-grid").style.display = "grid";

                if (docSnap.exists) {
                    const data = docSnap.data();
                    // Ẩn hiện các nút dựa trên config
                    const mapBtn = {
                        toan: "btn-toan", tv: "btn-tv", sudia: "btn-sudia", khoa: "btn-khoa",
                        daoduc: "btn-daoduc", congnghe: "btn-congnghe", mythuat: "btn-mythuat", hdtnghiem: "btn-hdtnghiem"
                    };
                    for (const [key, btnId] of Object.entries(mapBtn)) {
                        if (data[key] === false) document.getElementById(btnId).style.display = "none";
                    }
                }
            } catch (e) {
                console.error("Lỗi:", e);
                document.getElementById("loading").innerText = "Lỗi tải dữ liệu. Hãy tải lại trang.";
            }
        }
        checkMonHoc();
    </script>
</body>
</html>
