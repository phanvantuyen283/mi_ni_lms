<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tổng Hợp Điểm - Lớp 4A</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="config.js"></script>

    <style>
        /* CSS DÀNH RIÊNG CHO DASHBOARD */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; padding: 20px; font-size: 13px; color:#334155; margin: 0; }
        .container { max-width: 100%; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        /* HEADER & TOOLBAR */
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        h1 { margin: 0; color: #0284c7; text-transform: uppercase; font-size: 1.4rem; font-weight: 900; }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input[type="text"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 250px; outline: none; font-size: 13px; }
        input[type="text"]:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        button { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 5px; font-size: 13px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        button:active { transform: translateY(2px); box-shadow: none; }
        .btn-back { background: #64748b; } .btn-back:hover { background: #475569; }
        .btn-refresh { background: #0284c7; } .btn-refresh:hover { background: #0369a1; }
        .btn-excel { background: #16a34a; } .btn-excel:hover { background: #15803d; }
        
        /* BẢNG DỮ LIỆU */
        .table-wrapper { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; max-height: 75vh; box-shadow: inset 0 0 10px rgba(0,0,0,0.02); }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        
        th, td { border: 1px solid #e2e8f0; padding: 10px 8px; text-align: center; vertical-align: middle; }
        th { background: #f8fafc; color: #475569; font-weight: 800; white-space: nowrap; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #cbd5e1; }
        
        /* Cột Tên (Sticky) */
        .col-name { text-align: left; font-weight: bold; min-width: 180px; color: #1e293b; position: sticky; left: 0; background: #fff; z-index: 5; border-right: 2px solid #e2e8f0; }
        tr:hover .col-name { background: #f0f9ff; color: #0284c7; }
        tr:hover { background-color: #f8fafc; }
        
        /* HIỂN THỊ Ô ĐIỂM + THỜI GIAN */
        .cell-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .score-val { font-size: 16px; font-weight: 900; color: #0284c7; }
        .time-range { font-size: 11px; color: #d97706; font-weight: 600; background: #fff7ed; padding: 2px 6px; border-radius: 4px; margin-top: 4px; white-space: nowrap; border: 1px solid #ffedd5; }
        
        .missing-cell { font-size: 12px; color: #cbd5e1; font-weight: bold; }

        /* BADGE XẾP LOẠI */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .rank-xs { background: #dcfce7; color: #166534; border: 1px solid #86efac; } 
        .rank-tot { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; } 
        .rank-ht { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; } 
        .rank-cht { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; } 

        #loading { text-align: center; padding: 40px; color: #64748b; font-style: italic; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>📊 BẢNG TỔNG HỢP & PHÂN TÍCH LỚP 4A</h1>
        <button class="btn-back" onclick="window.location.href='Menu.html'">⬅ Quay về Menu</button>
    </div>

    <div class="toolbar">
        <input type="text" id="search-box" placeholder="🔍 Nhập tên học sinh để tìm..." onkeyup="filterTable()">
        <button class="btn-refresh" onclick="location.reload()">🔄 Cập nhật dữ liệu</button>
        <button class="btn-excel" onclick="exportExcel()">📥 Xuất Excel (Kèm thời gian)</button>
    </div>

    <div id="loading">
        ⏳ Đang kết nối máy chủ và tính toán dữ liệu...<br>
        <small>(Vui lòng đợi trong giây lát)</small>
    </div>

    <div class="table-wrapper" id="table-container" style="display:none">
        <table id="score-table">
            <thead>
                <tr>
                    <th style="width:50px">STT</th>
                    <th style="z-index:20; left:0">Họ và Tên</th>
                    
                    <th class="col-mon" data-id="toan">Toán</th>
                    <th class="col-mon" data-id="tv">Tiếng Việt</th>
                    <th class="col-mon" data-id="sudia">Sử - Địa</th>
                    <th class="col-mon" data-id="khoa">Khoa Học</th>
                    <th class="col-mon" data-id="daoduc">Đạo Đức</th>
                    <th class="col-mon" data-id="congnghe">Công Nghệ</th>
                    <th class="col-mon" data-id="mythuat">Mỹ Thuật</th>
                    <th class="col-mon" data-id="hdtnghiem">HĐTN</th>
                    
                    <th style="background:#f0f9ff; color:#0284c7; border-left: 2px solid #bae6fd;">Tổng Điểm</th>
                    <th style="background:#f0f9ff; color:#059669">Tiến độ</th>
                    <th>Xếp Loại</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    // --- 1. KHỞI TẠO HỆ THỐNG AN TOÀN ---
    if (typeof CONFIG === 'undefined') {
        alert("❌ LỖI: Không tìm thấy file config.js. Vui lòng kiểm tra lại hệ thống.");
    } else {
        if (!firebase.apps.length) {
            firebase.initializeApp(CONFIG.firebase);
        }
        var db = firebase.firestore();
    }

    // --- 2. DANH SÁCH HỌC SINH (Đồng bộ với Quan_Tri.html) ---
    const DANH_SACH_LOP = [
        "Vũ Việt Anh", "Vũ Gia Bảo", "Lê Thị Liên Chi", "Bùi Anh Dũng", "Vũ Quốc Duy", "Nguyễn Trí Đại", "Lê Bá Đạt", "Nguyễn Văn Đạt",
        "Vũ Ngọc Huyền", "Lê Gia Khánh", "Nguyễn Đăng Kiên", "Mai Quang Long", 
        "Lê Văn Lộc", "Vũ Anh Minh", "Hoàng Bảo Nam", "Phạm Thị Kim Ngân", "Vũ Thu Ngân", "Đàm Thị Quỳnh Như", "Nguyễn Hoàng Thiên Phúc", 
        "Vũ Quang Phúc", "Nguyễn Nhã Phương", "Nguyễn Thị Quỳnh", "Lê Ngọc Sơn", "Đặng Thị Thanh Tâm", 
        "Vũ Thị Minh Tâm", "--- GIÁO VIÊN TEST ---"
    ];

    const LIST_MON = ['toan', 'tv', 'sudia', 'khoa', 'daoduc', 'congnghe', 'mythuat', 'hdtnghiem'];
    
    // Cấu hình mặc định (sẽ được ghi đè bởi Firebase)
    let configMon = { toan: true, tv: true, sudia: true, khoa: true, daoduc: true, congnghe: true, mythuat: true, hdtnghiem: true }; 
    let bangDiem = {};

    // --- 3. LOGIC PHÂN LOẠI MÔN HỌC ---
    function phanLoaiMon(tieuDe) {
        if(!tieuDe) return null;
        let t = tieuDe.toUpperCase();
        // Logic khớp với tên file HTML trong Menu
        if (t.includes("TRẢI NGHIỆM") || t.includes("HĐTN")) return "hdtnghiem";
        if (t.includes("TOÁN")) return "toan";
        if (t.includes("TIẾNG VIỆT") || t.includes("TV")) return "tv";
        if (t.includes("SỬ") || t.includes("ĐỊA")) return "sudia";
        if (t.includes("KHOA")) return "khoa";
        if (t.includes("ĐẠO ĐỨC")) return "daoduc";
        if (t.includes("CÔNG NGHỆ")) return "congnghe";
        if (t.includes("MỸ THUẬT")) return "mythuat";
        return null;
    }

    // --- 4. HÀM XỬ LÝ DỮ LIỆU CHÍNH ---
    async function startApp() {
        if (!db) return;

        try {
            // Bước A: Tải cấu hình ẩn/hiện môn từ Server
            const configDoc = await db.collection("CAU_HINH").doc("trang_thai_mon").get();
            if (configDoc.exists) configMon = configDoc.data();

            // Bước B: Ẩn các cột môn học bị tắt bởi Giáo viên
            let reqCount = 0;
            document.querySelectorAll(".col-mon").forEach(th => {
                const id = th.getAttribute("data-id");
                if (configMon[id]) {
                    th.style.display = ""; 
                    reqCount++;
                } else {
                    th.style.display = "none";
                }
            });

            // Bước C: Tạo khung dữ liệu rỗng cho toàn bộ lớp
            DANH_SACH_LOP.forEach(ten => {
                bangDiem[ten] = {
                    name: ten, 
                    toan: null, tv: null, sudia: null, khoa: null, 
                    daoduc: null, congnghe: null, mythuat: null, hdtnghiem: null,
                    totalScore: 0, count: 0, req: reqCount
                };
            });

            // Bước D: Tải điểm từ Firebase
            const snapshot = await db.collection("KET_QUA_TONG_HOP").get();
            snapshot.forEach((doc) => {
                const d = doc.data();
                const tenHS = d.hoc_sinh;
                
                // Chỉ xử lý nếu tên học sinh có trong danh sách lớp
                if (bangDiem[tenHS]) {
                    const mon = phanLoaiMon(d.bai_tap);
                    if (mon && configMon[mon]) {
                        // Tính toán thời gian
                        const endTime = d.ngay_nop ? new Date(d.ngay_nop.seconds * 1000) : new Date();
                        const duration = d.thoi_gian_lam || 0; 
                        const startTime = new Date(endTime.getTime() - duration * 1000); 
                        
                        // Lưu điểm (Ghi đè nếu làm lại nhiều lần - lấy bài mới nhất)
                        bangDiem[tenHS][mon] = {
                            score: d.diem,
                            timeStr: `${formatTime(startTime)} - ${formatTime(endTime)}`
                        };
                    }
                }
            });

            // Bước E: Tính tổng điểm và tiến độ
            Object.values(bangDiem).forEach(hs => {
                LIST_MON.forEach(m => {
                    if(configMon[m] && hs[m]) {
                        hs.totalScore += hs[m].score;
                        hs.count++;
                    }
                });
            });

            // Bước F: Vẽ bảng
            renderTable();
            document.getElementById("loading").style.display = "none";
            document.getElementById("table-container").style.display = "block";

        } catch (e) { 
            console.error(e);
            alert("⚠️ Lỗi tải dữ liệu: " + e.message); 
        }
    }

    function formatTime(d) { 
        return d.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', hour12:false}); 
    }

    // --- 5. HÀM RENDER BẢNG ---
    function renderTable() {
        let arr = Object.values(bangDiem);
        
        // Sắp xếp: Ai làm nhiều bài nhất lên đầu -> Nếu bằng thì ai điểm cao hơn lên đầu
        arr.sort((a, b) => (b.count - a.count) || (b.totalScore - a.totalScore));

        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";

        arr.forEach((hs, i) => {
            // Logic Xếp loại
            let badgeClass = "rank-cht";
            let label = "Chưa xong";

            if (hs.count >= hs.req && hs.req > 0) {
                // Tìm điểm thấp nhất
                let min = 10;
                LIST_MON.forEach(m => {
                    if(configMon[m] && hs[m]) { if(hs[m].score < min) min = hs[m].score; }
                });

                if(min >= 9) { badgeClass = "rank-xs"; label = "Xuất Sắc"; }
                else if(min >= 7) { badgeClass = "rank-tot"; label = "Tốt"; }
                else if(min >= 5) { badgeClass = "rank-ht"; label = "Hoàn thành"; }
                else { label = "Cần cố gắng"; }
            } else {
                label = `Thiếu ${hs.req - hs.count} bài`;
            }

            // Tạo HTML các ô điểm
            let cellsHtml = "";
            LIST_MON.forEach(m => {
                if(configMon[m]) {
                    if(hs[m]) {
                        cellsHtml += `<td>
                            <div class="cell-content">
                                <span class="score-val">${hs[m].score.toFixed(1)}</span>
                                <span class="time-range">${hs[m].timeStr}</span>
                            </div>
                        </td>`;
                    } else {
                        cellsHtml += `<td><span class="missing-cell">-</span></td>`;
                    }
                }
            });

            // Màu sắc cột tổng
            let progressColor = hs.count >= hs.req ? "#059669" : "#dc2626";

            let row = `<tr>
                <td style="font-weight:bold; color:#64748b">${i+1}</td>
                <td class="col-name">${hs.name}</td>
                ${cellsHtml}
                <td style="font-weight:900; color:#0284c7; font-size:16px; border-left: 2px solid #bae6fd;">${hs.totalScore.toFixed(1)}</td>
                <td style="font-weight:bold; color:${progressColor}">${hs.count}/${hs.req}</td>
                <td><span class="badge ${badgeClass}">${label}</span></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // --- 6. TÌM KIẾM ---
    window.filterTable = function() {
        const txt = document.getElementById("search-box").value.toUpperCase();
        const rows = document.getElementById("table-body").getElementsByTagName("tr");
        for(let i=0; i<rows.length; i++) {
            const td = rows[i].getElementsByTagName("td")[1]; // Cột tên
            if(td) {
                rows[i].style.display = (td.textContent.toUpperCase().indexOf(txt) > -1) ? "" : "none";
            }
        }
    }

    // --- 7. XUẤT EXCEL ---
    window.exportExcel = function() {
        if(!confirm("Bạn có muốn tải xuống bảng dữ liệu này không?")) return;

        let tableClone = document.getElementById("score-table").cloneNode(true);
        let rows = tableClone.getElementsByTagName("tr");
        
        // Gộp điểm và thời gian vào một ô để dễ đọc
        for(let r=1; r<rows.length; r++) { 
            let cells = rows[r].getElementsByTagName("td");
            // Duyệt qua các cột môn (bỏ STT, Tên và 3 cột cuối)
            for(let c=2; c<cells.length-3; c++) { 
                let scoreEl = cells[c].querySelector(".score-val");
                let timeEl = cells[c].querySelector(".time-range");
                if(scoreEl && timeEl) {
                    cells[c].innerText = `${scoreEl.innerText} (${timeEl.innerText})`;
                }
            }
        }

        const wb = XLSX.utils.table_to_book(tableClone, {sheet:"Lop4A_KetQua"});
        XLSX.writeFile(wb, `Bao_Cao_Lop_4A_${new Date().getTime()}.xlsx`);
    }

    // Chạy ứng dụng
    startApp();
</script>
</body>
</html>
