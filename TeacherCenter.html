<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Giáo Viên V6.0 - Quản Lý & Chấm Bài</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="config.js"></script>

    <style>
        body { background: #f1f5f9; padding: 20px; font-family: 'Segoe UI', sans-serif; color: #1e293b; }
        .exam-card { background: white; padding: 25px; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-top: 6px solid #0284c7; }
        .student-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .dynamic-section { margin-top: 20px; background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .student-img { max-width: 100%; max-height: 400px; border-radius: 8px; margin-top: 10px; cursor: zoom-in; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-score { width: 80px; padding: 10px; border: 2px solid #0284c7; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .final-panel { background: #fffbeb; padding: 20px; border-radius: 12px; margin-top: 25px; border: 2px dashed #f59e0b; display: flex; flex-direction: column; gap: 10px; }
        .btn-approve { background: #059669; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .btn-approve:hover { filter: brightness(1.1); }
        .btn-reject { background: #dc2626; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <header style="text-align:center; margin-bottom:40px;">
        <h1 style="color:#0284c7; margin:0;">👨‍🏫 TRUNG TÂM KIỂM SOÁT HỌC TẬP</h1>
        <p style="color:#64748b;">Mini LMS V6.0 - Tính tổng điểm Real-time (Thời gian thực)</p>
    </header>

    <div id="exam-list" style="max-width: 900px; margin: 0 auto;">
        <div id="loading-status" style="text-align:center; padding:50px; color:#0284c7; font-weight:bold;">
            ⏳ Đang kết nối dữ liệu từ Firebase...
        </div>
    </div>

    <script>
        if (typeof db === 'undefined') {
            document.getElementById("loading-status").innerHTML = "<h3 style='color:red;'>❌ LỖI: Không tìm thấy biến 'db'. Hãy kiểm tra file config.js!</h3>";
        }

        db.collection("KET_QUA").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const listContainer = document.getElementById("exam-list");
            if (snapshot.empty) {
                listContainer.innerHTML = "<div class='exam-card' style='text-align:center;'>📭 Chưa có bài nộp nào được gửi lên.</div>";
                return;
            }

            listContainer.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                const isApproved = data.status === "approved";
                const timeStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString('vi-VN') : "Vừa xong";
                
                // 1. TRẮC NGHIỆM
                let sysScore = data.scores.sys || 0;
                let sysMax = data.scores.sys_max || 0;
                let sysHtml = `
                    <div class="dynamic-section">
                        <h4 style="margin:0 0 10px 0; color:#0f172a;">⚙️ Trắc nghiệm (Máy tự chấm): <span style="color:#0284c7">${sysScore}/${sysMax} điểm</span></h4>
                    </div>`;

                // 2. TỰ LUẬN (AI)
                let aiHtml = '';
                if (data.answers.ai && Object.keys(data.answers.ai).length > 0) {
                    aiHtml += `<div class="dynamic-section"><h4 style="margin:0 0 10px 0; color:#7c3aed;">🤖 Tự luận (AI chấm nháp - Thầy có thể sửa):</h4>`;
                    for (let qId in data.answers.ai) {
                        let studentAns = typeof data.answers.ai[qId] === 'object' ? data.answers.ai[qId].answer : data.answers.ai[qId];
                        let aiFeedbackData = (data.feedback.ai_details && data.feedback.ai_details[qId]) ? data.feedback.ai_details[qId] : {score: 0, feedback: "Chưa có nhận xét."};
                        
                        // FIX TẠI ĐÂY: Thay class bằng data-docid và dùng oninput
                        aiHtml += `
                            <div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #cbd5e1;">
                                <p style="margin:0 0 5px 0"><b>Bài làm (${qId}):</b> <i>${studentAns}</i></p>
                                <div style="background:#f5f3ff; padding:10px; border-radius:5px; margin-bottom:10px; font-size:14px; color:#5b21b6; border-left: 3px solid #7c3aed;">
                                    <b>AI gợi ý:</b> ${aiFeedbackData.feedback}
                                </div>
                                <div style="display:flex; gap:10px; align-items:center;">
                                    <b>Điểm Thầy chốt:</b> 
                                    <input type="number" data-docid="${docId}" class="input-score" value="${aiFeedbackData.score}" step="0.5" oninput="calculateTotal('${docId}', ${sysScore})">
                                </div>
                            </div>`;
                    }
                    aiHtml += `</div>`;
                }

                // 3. MULTIMEDIA (ẢNH CHỤP)
                let multiHtml = '';
                if (data.multimedia_urls && Object.keys(data.multimedia_urls).length > 0) {
                    multiHtml += `<div class="dynamic-section"><h4 style="margin:0 0 10px 0; color:#ea580c;">📸 Ảnh chụp (Thầy xem và nhập điểm):</h4>`;
                    for (let qId in data.multimedia_urls) {
                        let url = data.multimedia_urls[qId];
                        let savedScore = (data.scores.teacher_details && data.scores.teacher_details[qId]) ? data.scores.teacher_details[qId] : "";
                        
                        // FIX TẠI ĐÂY: Thay class bằng data-docid và dùng oninput
                        multiHtml += `
                            <div style="margin-bottom: 15px; text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px;">
                                <p style="margin:0 0 10px 0;"><b>Câu: ${qId}</b></p>
                                <a href="${url}" target="_blank"><img src="${url}" class="student-img"></a>
                                <div style="margin-top:15px; display:flex; justify-content:center; align-items:center; gap:10px;">
                                    <b>Điểm câu này:</b> 
                                    <input type="number" data-docid="${docId}" class="input-score" value="${savedScore}" step="0.5" placeholder="0" oninput="calculateTotal('${docId}', ${sysScore})">
                                </div>
                            </div>`;
                    }
                    multiHtml += `</div>`;
                }

                // 4. CHỐT ĐIỂM
                let totalCurrent = data.scores.teacher_final !== "" && data.scores.teacher_final !== undefined ? data.scores.teacher_final : (sysScore + (data.scores.ai_draft || 0));

                const card = document.createElement("div");
                card.className = "exam-card";
                card.innerHTML = `
                    <div class="student-header">
                        <div>
                            <h2 style="margin:0; color:#0284c7;">👤 ${data.student_name}</h2>
                            <span class="badge" style="background:#e0f2fe; color:#0369a1;">${data.subject}</span>
                            <small style="color:#94a3b8; display:block; margin-top:5px;">Nộp lúc: ${timeStr}</small>
                        </div>
                        <span class="badge" style="background:${isApproved ? '#dcfce7' : '#fef3c7'}; color:${isApproved ? '#166534' : '#b45309'}; font-size:14px;">
                            ${isApproved ? '✅ Đã duyệt' : '⏳ Chờ chấm'}
                        </span>
                    </div>

                    ${sysHtml}${aiHtml}${multiHtml}

                    <div class="final-panel">
                        <div style="font-size: 18px;"><b>TỔNG ĐIỂM CHÍNH THỨC:</b> 
                            <span id="total-view-${docId}" style="color:#dc2626; font-size:26px; font-weight:bold; margin-left:10px;">${totalCurrent}</span>
                        </div>
                        <label style="font-weight:bold; margin-top:10px;">Thầy nhận xét chung:</label>
                        <textarea id="final-fbk-${docId}" style="width:100%; height:80px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-family:inherit;" placeholder="Ghi lời phê vào đây...">${data.feedback.teacher_final || ""}</textarea>
                        
                        <div style="display:flex; gap:10px; margin-top:10px;" id="action-area-${docId}">
                            <button class="btn-approve" style="flex:2;" onclick="updateGrade('${docId}', 'approved')">✅ DUYỆT & GỬI ĐIỂM</button>
                            <button class="btn-reject" style="flex:1;" onclick="updateGrade('${docId}', 'pending')">❌ CHƯA ĐẠT (LÀM LẠI)</button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        });

        // HÀM CỘNG TỔNG ĐIỂM ĐỘNG (FIX LỖI KHOẢNG TRẮNG)
        window.calculateTotal = function(docId, sysScore) {
            let total = sysScore;
            // Dùng data-docid để gọi truy vấn thay vì gọi bằng class, tránh hoàn toàn lỗi dấu cách
            document.querySelectorAll(`input[data-docid="${docId}"]`).forEach(input => {
                let val = parseFloat(input.value);
                if (!isNaN(val)) total += val;
            });
            // Cập nhật ngay lập tức con số tổng màu đỏ
            document.getElementById(`total-view-${docId}`).innerText = total;
        };

        // HÀM GỬI ĐIỂM LÊN FIREBASE
        window.updateGrade = async function(docId, statusType) {
            const area = document.getElementById(`action-area-${docId}`);
            const originalHTML = area.innerHTML;
            area.innerHTML = "<b style='color:#059669;'>⏳ Đang lưu dữ liệu lên hệ thống...</b>";

            try {
                // Lấy con số tổng từ thẻ span
                const finalScore = parseFloat(document.getElementById(`total-view-${docId}`).innerText);
                const finalFeedback = document.getElementById(`final-fbk-${docId}`).value;

                await db.collection("KET_QUA").doc(docId).update({
                    "status": statusType,
                    "scores.teacher_final": finalScore,
                    "feedback.teacher_final": finalFeedback,
                    "timestamp_graded": firebase.firestore.FieldValue.serverTimestamp()
                });

                area.innerHTML = "<b style='color:#059669;'>✅ Đã lưu và gửi điểm cho học sinh!</b>";
                setTimeout(() => { area.innerHTML = originalHTML; }, 2000);
            } catch (err) {
                alert("Lỗi khi lưu điểm: " + err.message);
                area.innerHTML = originalHTML;
            }
        };
    </script>
</body>
</html>
