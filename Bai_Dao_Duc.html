<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm Bài Tập - Lớp 4A</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div style="margin-bottom:15px">
            <a href="Menu.html" style="text-decoration:none; color:#64748b; font-weight:bold;">⬅ Quay về Menu</a>
        </div>

        <div class="header">
            <div class="info">
                <h2 id="ten-bai-tap">ĐẠO ĐỨC - TUẦN 19</h2>
                <p style="margin-top:5px; font-size:13px">Học sinh: <span id="student-display" style="font-weight:bold; color:#0284c7">...</span></p>
            </div>
            <div class="timer">⏱ <span id="timer">00:00</span></div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 1: Em đi học thấy đèn đỏ, em sẽ làm gì?</div>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> A. Đi tiếp cho nhanh</label>
                <label><input type="radio" name="q1" value="B" data-correct="true"> B. Dừng lại chờ đèn xanh</label>
            </div>
        </div>

        <button id="btn-nop" onclick="nopBai()">NỘP BÀI</button>
    </div>

    <script src="config.js"></script>
    <script src="core.js"></script>

</body>
</html>
