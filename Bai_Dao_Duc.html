<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm Bài Tập - Lớp 4A</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div style="margin-bottom:15px">
            <a href="Menu.html" style="text-decoration:none; color:#64748b; font-weight:bold;">⬅ Quay về Menu</a>
        </div>

        <div class="header">
            <div class="info">
                <h2 id="ten-bai-tap">ĐẠO ĐỨC - TUẦN 19</h2> 
                <p style="margin-top:5px; font-size:13px">Học sinh: <span id="student-display" style="font-weight:bold; color:#0284c7">...</span></p>
            </div>
            <div class="timer">⏱ <span id="timer">00:00</span></div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 1: Em thấy bạn làm rơi bút, em sẽ làm gì?</div>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> A. Mặc kệ bạn</label>
                <label><input type="radio" name="q1" value="B" data-correct="true"> B. Nhặt giúp bạn</label>
                <label><input type="radio" name="q1" value="C"> C. Đá bút đi chỗ khác</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 2: Giữ gìn trường lớp là trách nhiệm của ai?</div>
            <div class="options">
                <label><input type="radio" name="q2" value="A" data-correct="true"> A. Tất cả học sinh</label>
                <label><input type="radio" name="q2" value="B"> B. Chỉ bác bảo vệ</label>
            </div>
        </div>

        <button id="btn-nop">NỘP BÀI</button>
        
        <p id="debug-log" style="text-align:center; color:red; font-size:12px; margin-top:10px"></p>
    </div>

    <script src="config.js"></script> 
    
    <script src="core.js"></script>

    <script>
        window.onload = function() {
            // Kiểm tra xem các file hệ thống đã khớp lệnh chưa
            let logs = [];
            if (typeof firebase === 'undefined') logs.push("❌ Thiếu Thư viện Firebase (Kiểm tra thẻ Head)");
            if (typeof firebaseConfig === 'undefined') logs.push("❌ Thiếu file config.js (Hoặc file này bị lỗi)");
            if (typeof nopBai === 'undefined') logs.push("❌ Thiếu file core.js (Hoặc code bị lỗi cú pháp)");
            
            if (logs.length > 0) {
                document.getElementById("debug-log").innerText = "LỖI HỆ THỐNG: " + logs.join(", ");
                alert("⚠️ HỆ THỐNG BỊ NGẮT KẾT NỐI:\n" + logs.join("\n"));
            } else {
                console.log("✅ Hệ thống đồng bộ hoàn hảo!");
            }
        }
    </script>
</body>
</html>
