<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm Bài Tập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div class="menu-top">
            <a href="index.html">⬅ Quay về trang điểm danh</a>
        </div>

        <div class="header">
            <div class="info">
                <h2 id="ten-bai-tap">Bai_ Dao _ Duc</h2>
                <p>Học sinh: <span id="student-display" style="font-weight:bold; color:#0284c7">...</span></p>
            </div>
            <div class="timer">⏱ <span id="timer">00:00</span></div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 1: Số 10 chia cho 2 bằng mấy?</div>
            <div class="options">
                <label><input type="radio" name="c1" value="A"> A. 3</label>
                <label><input type="radio" name="c1" value="B" data-correct="true"> B. 5</label>
                <label><input type="radio" name="c1" value="C"> C. 8</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 2: Hình tam giác có mấy cạnh?</div>
            <div class="options">
                <label><input type="radio" name="c2" value="A" data-correct="true"> A. 3 cạnh</label>
                <label><input type="radio" name="c2" value="B"> B. 4 cạnh</label>
            </div>
        </div>

        <button id="btn-nop" onclick="nopBai()">NỘP BÀI</button>
    </div>

        <script src="config.js"></script>

    <script src="core.js"></script>
</body>

</body>
</html>
