<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Đăng Nhập Lớp 4A</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Thêm style cho ô nhập mã */
        #access-code {
            width: 100%; padding: 15px 20px; margin: 10px 0 20px 0;
            border-radius: 12px; border: 3px solid #e2e8f0;
            font-size: 20px; font-weight: bold; color: #dc2626; letter-spacing: 2px; text-align: center; text-transform: uppercase;
            outline: none; background: #fff;
        }
        #access-code:focus { border-color: #ef4444; }
        #access-code::placeholder { color: #ccc; font-size: 14px; letter-spacing: normal; text-transform: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 style="color:#0284c7; margin-bottom:10px">🔐 CỔNG BẢO MẬT LỚP 4A</h2>
        <p style="color:#666">Chọn tên và nhập mã bí mật để vào lớp:</p>
        
        <select id="student-name">
            <option value="">-- Chọn tên của em --</option>
        </select>
        
        <input type="text" id="access-code" placeholder="Nhập mã (Ví dụ: ABC123)">
        
        <button id="btn-login" onclick="checkLogin()">KIỂM TRA & VÀO LỚP</button>
    </div>

    <script>
        // CẤU HÌNH FIREBASE
        const firebaseConfig = { apiKey: "AIzaSyA77lLi_JCLIdR535KEfg3S0_Ge2EorPMo", authDomain: "baikiemtracuoiki.firebaseapp.com", projectId: "baikiemtracuoiki", storageBucket: "baikiemtracuoiki.firebasestorage.app", messagingSenderId: "953819948776", appId: "1:953819948776:web:4e9a017a6c5fc10ed28b5d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const DANH_SACH = [ "Vũ Việt Anh", "Vũ Gia Bảo", "Lê Thị Liên Chi", "Bùi Anh Dũng", "Vũ Quốc Duy", "Nguyễn Đăng Dương", "Nguyễn Trí Đại", "Lê Bá Đạt", "Nguyễn Văn Đạt", "Lê Minh Hạnh", "Vũ Ngọc Huyền", "Lê Gia Khánh", "Nguyễn Đăng Kiên", "Vũ Đình Khánh Linh", "Mai Quang Long", "Lê Văn Lộc", "Vũ Anh Minh", "Hoàng Bảo Nam", "Phạm Thị Kim Ngân", "Vũ Thu Ngân", "Vũ Thị Yến Nhi", "Đàm Thị Quỳnh Như", "Phạm Hạnh Gia Phát", "Nguyễn Hoàng Thiên Phúc", "Vũ Quang Phúc", "Nguyễn Nhã Phương", "Nguyễn Thị Quỳnh", "Lê Ngọc Sơn", "Đặng Thị Thanh Tâm", "Vũ Thị Minh Tâm", "Lê Vũ Chí Thành", "Lê Anh Thơ", "Vũ Song Vũ", "--- GIÁO VIÊN TEST ---" ];
        
        const sel = document.getElementById("student-name");
        DANH_SACH.forEach(ten => {
            let opt = document.createElement("option"); opt.value = ten; opt.text = ten; sel.add(opt);
        });

        // HÀM KIỂM TRA ĐĂNG NHẬP
        async function checkLogin() {
            const name = sel.value;
            const codeInput = document.getElementById("access-code").value.trim().toUpperCase();
            const btn = document.getElementById("btn-login");

            if(!name) return alert("Em chưa chọn tên!");
            if(!codeInput) return alert("Em chưa nhập mã bí mật!");

            btn.innerText = "Đang kiểm tra...";
            btn.disabled = true;

            try {
                // Lấy danh sách mã từ Firebase
                const docSnap = await db.collection("BAO_MAT").doc("danh_sach_ma").get();
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const codeDung = data[name]; // Mã đúng của học sinh này

                    if (codeInput === codeDung) {
                        // ĐÚNG MÃ -> LƯU VÀ CHUYỂN
                        localStorage.setItem("hocSinhLop4A", name);
                        window.location.href = "Menu.html";
                    } else {
                        // SAI MÃ -> BÁO LỖI
                        alert("⛔ Sai mã đăng nhập!\nHãy liên hệ Zalo với thầy Tuyến để lấy mã đúng.");
                        btn.innerText = "KIỂM TRA & VÀO LỚP";
                        btn.disabled = false;
                    }
                } else {
                    alert("Hệ thống chưa có dữ liệu mã. Vui lòng báo thầy giáo.");
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Lỗi kết nối: " + e.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
