<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LMS_STUDENT</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script src="config.js"></script>

    <style>
        :root { --primary: #0284c7; --secondary: #38bdf8; --bg: #f0f9ff; --text: #1e293b; --success: #22c55e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        header { background: white; padding: 15px 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-bottom: 4px solid var(--primary); }
        header h1 { margin: 0; color: var(--primary); font-size: 1.5rem; text-transform: uppercase; }
        #login-section { width: 90%; max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); border: 2px solid #e0f2fe; box-sizing: border-box; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; }
        .input-group select, .input-group input { width: 100%; padding: 14px 12px; border: 2px solid #bae6fd; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; }
        .btn-login { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        #dashboard-section { display: none; max-width: 900px; margin: 30px auto; padding: 0 15px; width: 100%; box-sizing: border-box; }
        .welcome-box { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 25px 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .subject-card { background: white; border: 2px solid #e0f2fe; padding: 20px 15px; border-radius: 15px; text-align: center; cursor: pointer; }
        .result-item { background: white; padding: 15px 20px; border-radius: 12px; border-left: 5px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .result-item.approved { border-left-color: var(--success); }
        .score-box { font-size: 20px; font-weight: bold; color: var(--primary); background: #e0f2fe; padding: 8px 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <header><h1>🌟 LỚP 4A-TH CHÂU LỘC 🌟</h1></header>

    <div id="login-section">
        <div class="input-group">
            <label>1. Chọn tên bạn trong danh sách!</label>
            <select id="student-name"><option value="">-- Đang tải danh sách... --</option></select>
        </div>
        <div class="input-group">
            <label>2. Mã số bí mật (Zalo):</label>
            <input type="password" id="student-code" placeholder="Nhập mã 6 chữ số">
        </div>
        <div class="input-group">
            <label>3. Câu hỏi bảo mật của lớp:</label>
            <div id="sec-question-display" style="font-size:14px; color:#0369a1; margin-bottom:8px; font-style:italic; font-weight:600;">...</div>
            <input type="text" id="sec-answer" placeholder="Đáp án viết liền không dấu">
        </div>
        <button class="btn-login" onclick="handleLogin()">VÀO LỚP 🚀</button>
    </div>

    <div id="dashboard-section">
        <div class="welcome-box">
            <div><h2 id="display-name">...</h2><p>Chúc em một ngày học tập vui vẻ.</p></div>
            <button onclick="sessionStorage.clear(); location.reload();" style="background:rgba(255,255,255,0.2); border:1px solid white; color:white; padding:10px; border-radius:8px; cursor:pointer;">Thoát</button>
        </div>
        <h3 style="color:var(--primary)">📚 BÀI TẬP HÔM NAY</h3>
        <div class="subject-grid" id="active-subjects"></div>
        <h3 style="color:var(--primary); margin-top:30px;">📝 KẾT QUẢ CỦA EM</h3>
        <div id="my-results"></div>
    </div>

    <script>
        // KIỂM TRA BIẾN db TỪ config.js
        if (typeof db === 'undefined') {
            alert("❌ Lỗi: Không thể kết nối Firestore. Hãy kiểm tra lại file config.js!");
        }

        let sysData = { codes: {}, secAnswer: "" };

        // 1. TẢI DANH SÁCH HỌC SINH VÀ CẤU HÌNH
        document.addEventListener("DOMContentLoaded", async () => {
            const savedUser = sessionStorage.getItem("LMS_User");
            if (savedUser) { showDashboard(savedUser); return; }

            try {
                // Tải mã từ BAO_MAT/danh_sach_ma
                const codeSnap = await db.collection("BAO_MAT").doc("danh_sach_ma").get();
                if (codeSnap.exists) {
                    sysData.codes = codeSnap.data();
                    const select = document.getElementById("student-name");
                    select.innerHTML = '<option value="">-- Chọn tên của em --</option>';
                    Object.keys(sysData.codes).filter(k => k !== 'admin_key' && k !== 'updated_at').sort().forEach(name => {
                        let opt = document.createElement("option"); opt.value = name; opt.innerText = name;
                        select.appendChild(opt);
                    });
                }
                // Tải câu hỏi bảo mật từ CAU_HINH/cau_hinh_chung
                const confSnap = await db.collection("CAU_HINH").doc("cau_hinh_chung").get();
                if (confSnap.exists) {
                    document.getElementById("sec-question-display").innerText = confSnap.data().question || "Câu hỏi của lớp?";
                    sysData.secAnswer = (confSnap.data().answer || "").toLowerCase().trim();
                }
            } catch (error) { console.error("Lỗi:", error); }
        });

        // 2. XỬ LÝ ĐĂNG NHẬP
        function handleLogin() {
            const name = document.getElementById("student-name").value;
            const code = document.getElementById("student-code").value.trim();
            const ans = document.getElementById("sec-answer").value.toLowerCase().trim();

            if (!name || !code) return alert("Em điền thiếu thông tin!");
            if (sysData.codes[name] !== code) return alert("Mã số bí mật không đúng!");
            if (sysData.secAnswer && ans !== sysData.secAnswer) return alert("Câu trả lời bảo mật sai!");

            sessionStorage.setItem("LMS_User", name);
            showDashboard(name);
        }

        function showDashboard(userName) {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("dashboard-section").style.display = "block";
            document.getElementById("display-name").innerText = "👋 Chào em, " + userName + "!";
            loadActiveSubjects(); 
            loadMyResults(userName);
        }

        // 3. TẢI MÔN HỌC
        async function loadActiveSubjects() {
            const grid = document.getElementById("active-subjects");
            try {
                const snap = await db.collection("CAI_DAT_MON_HOC").doc("status").get();
                if (snap.exists) {
                    const statusData = snap.data(); let html = "";
                    const icons = { "Toán": "📐", "Tiếng Việt": "📘", "Tiếng Anh": "🇬🇧", "Khoa học": "🔬", "Lịch sử & Địa lý": "🌍" };
                    GLOBAL_CONFIG.SUBJECTS.forEach(sub => {
                        if (statusData[sub] === true) {
                            html += `<div class="subject-card" onclick="goToExam('${sub}')">
                                <div style="font-size:40px;">${icons[sub] || "📙"}</div>
                                <div style="font-weight:bold; margin-top:10px;">${sub}</div>
                            </div>`;
                        }
                    });
                    grid.innerHTML = html || "<p>Chưa có môn nào mở.</p>";
                }
            } catch (e) { grid.innerHTML = "<p>Lỗi tải môn học.</p>"; }
        }

        function goToExam(subjectName) {
            const map = { "Toán": "Bai_Toan.html", "Tiếng Việt": "Bai_Tieng_Viet.html", "Khoa học": "Bai_Khoa_Hoc.html", "Lịch sử & Địa lý": "Bai_Su_Dia.html", "Công nghệ": "Bai_Cong_Nghe.html", "Đạo đức": "Bai_Dao_Duc.html", "Hoạt động trải nghiệm": "Bai_HD_Trai_Nghiem.html", "Mĩ thuật": "Bai_My_Thuat.html", "Giáo dục thể chất": "Bai_The_Duc.html", "Tiếng Anh": "Bai_Tieng_Anh.html", "Tin học": "Bai_Tin_Hoc.html", "Âm nhạc": "Bai_Am_Nhac.html" };
            if (map[subjectName]) window.location.href = map[subjectName];
            else alert("Môn này đang được thầy cập nhật!");
        }

        // 4. HIỂN THỊ KẾT QUẢ (SỬA LỖI UNDEFINED & MẤT BÀI)
        async function loadMyResults(userName) {
            const list = document.getElementById("my-results");
            try {
                const snap = await db.collection("KET_QUA").where("student_name", "==", userName).get();
                if (snap.empty) {
                    list.innerHTML = "<p style='text-align:center;'>Em chưa nộp bài nào.</p>";
                    return;
                }
                let results = []; snap.forEach(doc => results.push(doc.data()));
                results.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                let html = "";
                results.forEach(data => {
                    const isApproved = data.status === "approved";
                    const timeStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString('vi-VN') : "Vừa xong";
                    // SỬA LỖI: Gọi đúng scores.teacher_final
                    const scoreDisplay = isApproved ? (data.scores.teacher_final + "đ") : "⏳ Đang chấm";
                    html += `<div class="result-item ${isApproved ? 'approved' : ''}">
                        <div>
                            <h4 style="margin:0">${data.subject}</h4>
                            <small>Đã nộp: ${timeStr}</small>
                            <div style="font-size:13px; color:#64748b; margin-top:5px;">${isApproved ? (data.feedback.teacher_final || "Thầy đã chấm bài.") : "Bài đang chờ thầy kiểm tra."}</div>
                        </div>
                        <div class="score-box">${scoreDisplay}</div>
                    </div>`;
                });
                list.innerHTML = html;
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
