<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Lớp 4A</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f9ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; border-top: 5px solid #0284c7; }
        h2 { color: #0284c7; margin-bottom: 20px; }
        select, input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 16px; box-sizing: border-box; }
        button { background-color: #0284c7; color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #0369a1; }
        .footer { font-size: 12px; color: #64748b; margin-top: 10px; }
        
        /* Phần câu hỏi bảo mật (Ẩn mặc định) */
        #security-section { display: none; background: #fff1f2; padding: 10px; border-radius: 8px; border: 1px dashed #e11d48; margin-bottom: 15px; }
        .security-label { color: #be123c; font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; text-align: left;}
        #security-input { border-color: #e11d48; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🚀 LỚP 4A ONLINE</h2>
        
        <select id="student-name">
            <option value="">-- Chọn tên của bạn --</option>
        </select>
        
        <input type="text" id="access-code" placeholder="Nhập mã bí mật (6 chữ cái)" style="text-transform:uppercase">

        <div id="security-section">
            <span class="security-label" id="security-question-text">❓ Câu hỏi bảo mật: ...</span>
            <input type="text" id="security-input" placeholder="Nhập câu trả lời...">
        </div>

        <button onclick="login()">ĐĂNG NHẬP NGAY</button>
        
        <p class="footer">Hệ thống kiểm tra & đánh giá năng lực</p>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA77lLi_JCLIdR535KEfg3S0_Ge2EorPMo", authDomain: "baikiemtracuoiki.firebaseapp.com", projectId: "baikiemtracuoiki", storageBucket: "baikiemtracuoiki.firebasestorage.app", messagingSenderId: "953819948776", appId: "1:953819948776:web:4e9a017a6c5fc10ed28b5d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const DANH_SACH_LOP = [ "Vũ Việt Anh", "Vũ Gia Bảo", "Lê Thị Liên Chi", "Bùi Anh Dũng", "Vũ Quốc Duy", "Nguyễn Đăng Dương", "Nguyễn Trí Đại", "Lê Bá Đạt", "Nguyễn Văn Đạt", "Lê Minh Hạnh", "Vũ Ngọc Huyền", "Lê Gia Khánh", "Nguyễn Đăng Kiên", "Vũ Đình Khánh Linh", "Mai Quang Long", "Lê Văn Lộc", "Vũ Anh Minh", "Hoàng Bảo Nam", "Phạm Thị Kim Ngân", "Vũ Thu Ngân", "Vũ Thị Yến Nhi", "Đàm Thị Quỳnh Như", "Phạm Hạnh Gia Phát", "Nguyễn Hoàng Thiên Phúc", "Vũ Quang Phúc", "Nguyễn Nhã Phương", "Nguyễn Thị Quỳnh", "Lê Ngọc Sơn", "Đặng Thị Thanh Tâm", "Vũ Thị Minh Tâm", "Lê Vũ Chí Thành", "Lê Anh Thơ", "Vũ Song Vũ", "--- GIÁO VIÊN TEST ---" ];
        const select = document.getElementById("student-name");
        DANH_SACH_LOP.forEach(name => { let opt = document.createElement("option"); opt.value = name; opt.innerText = name; select.appendChild(opt); });

        // BIẾN LƯU ĐÁP ÁN ĐÚNG
        let correctAnswer = ""; 

        // 1. KIỂM TRA XEM CÓ CÂU HỎI BẢO MẬT KHÔNG
        db.collection("BAO_MAT").doc("cau_hoi_ngay").get().then(doc => {
            if (doc.exists) {
                const data = doc.data();
                // Nếu có câu hỏi và câu hỏi không rỗng
                if (data.question && data.question.trim() !== "") {
                    document.getElementById("security-section").style.display = "block";
                    document.getElementById("security-question-text").innerText = "❓ " + data.question;
                    correctAnswer = data.answer ? data.answer.trim().toLowerCase() : "";
                }
            }
        });

        async function login() {
            const name = document.getElementById("student-name").value;
            const code = document.getElementById("access-code").value.trim().toUpperCase();
            const secAns = document.getElementById("security-input").value.trim().toLowerCase();

            if (!name) return alert("Vui lòng chọn tên!");
            if (!code) return alert("Vui lòng nhập mã!");

            // KIỂM TRA CÂU HỎI BẢO MẬT (Nếu có)
            if (correctAnswer !== "") {
                if (secAns === "") return alert("Vui lòng trả lời câu hỏi bảo mật!");
                // So sánh tương đối (xóa dấu cách, chữ hoa thường)
                if (secAns !== correctAnswer) {
                    return alert("❌ Trả lời sai câu hỏi bảo mật!\nHãy quan sát kỹ lớp học hoặc hỏi bạn bè.");
                }
            }

            try {
                const doc = await db.collection("BAO_MAT").doc("danh_sach_ma").get();
                if (doc.exists) {
                    const validCode = doc.data()[name];
                    if (validCode === code) {
                        localStorage.setItem("hocSinhLop4A", name);
                        window.location.href = "Menu.html";
                    } else {
                        alert("❌ Mã đăng nhập không đúng!");
                    }
                } else {
                    alert("⚠️ Hệ thống đang đóng cửa (Chưa tạo mã)!");
                }
            } catch (e) {
                alert("Lỗi kết nối: " + e.message);
            }
        }
    </script>

</body>
</html>
