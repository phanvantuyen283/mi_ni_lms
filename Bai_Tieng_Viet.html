<body>

    <div class="quiz-container">
        <div style="margin-bottom:15px">

        // Hàm render HTML từ dữ liệu (Chạy ngay khi tải trang)
        function renderQuizToHTML() {
            const container = document.getElementById("quiz-content");
            let html = "";

            quizData.forEach(item => {
                let optionsHtml = "";
                item.options.forEach((opt, index) => {
                    // Tạo ID duy nhất cho mỗi input để label hoạt động tốt
                    const inputName = `q${item.q}`;
                    const isCorrect = opt.correct ? 'data-correct="true"' : '';
                    const explainAttr = opt.correct ? `data-explain="${opt.explain}"` : '';
                    
                    optionsHtml += `
                        <label>
                            <input type="radio" name="${inputName}" value="${index}" ${isCorrect} ${explainAttr}> 
                            ${String.fromCharCode(65 + index)}. ${opt.text}
                        </label>
                    `;
                });

                html += `
                    <div class="question-block">
                        <div class="question-text">Câu ${item.q}: ${item.text}</div>
                        ${item.hint ? `<div style="font-size:13px; color:#64748b; font-style:italic; margin-bottom:10px">${item.hint}</div>` : ''}
                        <div class="options">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Chạy hàm render
        renderQuizToHTML();
    </script>
