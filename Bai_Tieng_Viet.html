<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếng Việt 4 - Luyện từ và câu & TLV</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="config.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Tùy biến giao diện cho môn Tiếng Việt */
        body { background-color: #f0fdf4; font-family: 'Segoe UI', sans-serif; }
        .header { 
            border-color: #15803d; 
            background: #dcfce7; 
            padding: 20px; 
            border-bottom: 3px solid; 
            border-radius: 8px 8px 0 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .header h2 { color: #166534; margin: 0; font-size: 1.2rem; }
        .section-title {
            color: #166534;
            border-bottom: 2px solid #86efac;
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .quiz-container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .question-block { margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border-left: 4px solid #15803d; }
        .question-text { font-weight: 600; margin-bottom: 10px; color: #334155; }
        .options label { display: block; margin-bottom: 8px; cursor: pointer; padding: 8px; border-radius: 4px; transition: background 0.2s; }
        .options label:hover { background: #e2e8f0; }
        
        /* Nut nop bai xanh la */
        #btn-nop { 
            background: linear-gradient(to bottom, #22c55e, #15803d); 
            box-shadow: 0 4px 0 #14532d; 
            color: white; border: none; padding: 12px 25px; 
            border-radius: 5px; font-weight: bold; cursor: pointer; 
            display: block; margin: 20px auto; width: 200px;
            transition: all 0.2s;
        }
        #btn-nop:active { transform: translateY(4px); box-shadow: none; }
    </script>
</head>
<body>

    <div class="quiz-container">
        <div style="margin-bottom:15px">
            <a href="Menu.html" style="text-decoration:none; color:#64748b; font-weight:bold; font-size:14px">⬅ Quay về danh sách bài học</a>
        </div>

        <div class="header">
            <div class="info">
                <h2 id="ten-bai-tap">TIẾNG VIỆT 4: CẤU TẠO CÂU & VĂN BIỂU CẢM</h2>
                <p style="margin-top:5px; font-size:13px">Học sinh: <span id="student-display" style="font-weight:bold; color:#15803d">Đang tải...</span></p>
            </div>
            <div class="timer" style="font-weight:bold; color:#d97706">⏱ <span id="timer">--:--</span></div>
        </div>

        <div class="section-title">PHẦN 1: LUYỆN TỪ VÀ CÂU (CHỦ NGỮ - VỊ NGỮ)</div>

        <div class="question-block">
            <div class="question-text">Câu 1: Câu kể thường gồm hai thành phần chính nào?</div>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> A. Trạng ngữ và Vị ngữ</label>
                <label><input type="radio" name="q1" value="B" data-correct="true" data-explain="Một câu kể hoàn chỉnh thường được cấu tạo bởi hai bộ phận chính là Chủ ngữ và Vị ngữ."> B. Chủ ngữ và Vị ngữ</label>
                <label><input type="radio" name="q1" value="C"> C. Danh từ và Động từ</label>
                <label><input type="radio" name="q1" value="D"> D. Chủ ngữ và Tính từ</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 2: Chủ ngữ trong câu kể "Ai làm gì?" thường trả lời cho câu hỏi nào?</div>
            <div class="options">
                <label><input type="radio" name="q2" value="A"> A. Là gì?</label>
                <label><input type="radio" name="q2" value="B"> B. Làm gì?</label>
                <label><input type="radio" name="q2" value="C" data-correct="true" data-explain="Chủ ngữ chỉ sự vật (người, vật) thực hiện hoạt động nên trả lời cho câu hỏi Ai, Cái gì, Con gì."> C. Ai, Cái gì, Con gì?</label>
                <label><input type="radio" name="q2" value="D"> D. Thế nào?</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 3: Vị ngữ trong câu "Đàn chim én đang bay lượn trên bầu trời" là bộ phận nào?</div>
            <div class="options">
                <label><input type="radio" name="q3" value="A"> A. Đàn chim én</label>
                <label><input type="radio" name="q3" value="B" data-correct="true" data-explain="Bộ phận này nêu hoạt động của đàn chim, trả lời cho câu hỏi 'Làm gì?'."> B. đang bay lượn trên bầu trời</label>
                <label><input type="radio" name="q3" value="C"> C. trên bầu trời</label>
                <label><input type="radio" name="q3" value="D"> D. bay lượn</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 4: Tìm Chủ ngữ trong câu: "Dưới gốc cây, mấy chú gà con đang bới đất tìm giun."</div>
            <div class="options">
                <label><input type="radio" name="q4" value="A"> A. Dưới gốc cây</label>
                <label><input type="radio" name="q4" value="B" data-correct="true" data-explain="Đây là sự vật thực hiện hành động 'bới đất', trả lời cho câu hỏi 'Con gì?'."> B. mấy chú gà con</label>
                <label><input type="radio" name="q4" value="C"> C. đang bới đất</label>
                <label><input type="radio" name="q4" value="D"> D. tìm giun</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 5: Trong câu "Mái tóc bà em bạc phơ.", Vị ngữ trả lời cho câu hỏi nào?</div>
            <div class="options">
                <label><input type="radio" name="q5" value="A"> A. Làm gì?</label>
                <label><input type="radio" name="q5" value="B" data-correct="true" data-explain="'Bạc phơ' là từ chỉ đặc điểm/trạng thái của mái tóc, nên trả lời cho câu hỏi 'Thế nào?'."> B. Thế nào?</label>
                <label><input type="radio" name="q5" value="C"> C. Là gì?</label>
                <label><input type="radio" name="q5" value="D"> D. Ở đâu?</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 6: Dòng nào dưới đây nêu đúng cấu tạo của câu: "Hà Nội là thủ đô của nước Việt Nam."?</div>
            <div class="options">
                <label><input type="radio" name="q6" value="A" data-correct="true" data-explain="Đây là câu kể 'Ai là gì?'. Chủ ngữ trả lời 'Cái gì?', Vị ngữ bắt đầu bằng từ 'là'."> A. Chủ ngữ: Hà Nội; Vị ngữ: là thủ đô của nước Việt Nam.</label>
                <label><input type="radio" name="q6" value="B"> B. Chủ ngữ: Hà Nội là; Vị ngữ: thủ đô của nước Việt Nam.</label>
                <label><input type="radio" name="q6" value="C"> C. Chủ ngữ: Hà Nội là thủ đô; Vị ngữ: của nước Việt Nam.</label>
                <label><input type="radio" name="q6" value="D"> D. Chủ ngữ: Hà Nội; Vị ngữ: thủ đô của nước Việt Nam.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 7: Chủ ngữ trong câu nào dưới đây chỉ "sự vật được miêu tả" (Kiểu câu Ai thế nào)?</div>
            <div class="options">
                <label><input type="radio" name="q7" value="A"> A. Bác nông dân đang cày ruộng.</label>
                <label><input type="radio" name="q7" value="B" data-correct="true" data-explain="Câu này miêu tả đặc điểm (hương thơm) của sự vật (hoa hồng)."> B. Những đóa hoa hồng tỏa hương thơm ngát.</label>
                <label><input type="radio" name="q7" value="C"> C. Con mèo đang ngủ trên ghế.</label>
                <label><input type="radio" name="q7" value="D"> D. Em là học sinh lớp 4.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 8: Điền Vị ngữ thích hợp vào chỗ trống để tạo thành câu kể "Ai làm gì?": "Vào giờ ra chơi, các bạn học sinh ..."</div>
            <div class="options">
                <label><input type="radio" name="q8" value="A"> A. rất vui vẻ.</label>
                <label><input type="radio" name="q8" value="B" data-correct="true" data-explain="'Ùa ra', 'đá cầu', 'nhảy dây' là các từ chỉ hoạt động cụ thể."> B. ùa ra sân trường đá cầu, nhảy dây.</label>
                <label><input type="radio" name="q8" value="C"> C. là những người bạn thân thiết.</label>
                <label><input type="radio" name="q8" value="D"> D. thật ngoan ngoãn.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 9: Xác định từ loại của Chủ ngữ trong câu: "Chăm chỉ là đức tính tốt của học sinh."</div>
            <div class="options">
                <label><input type="radio" name="q9" value="A"> A. Danh từ</label>
                <label><input type="radio" name="q9" value="B"> B. Động từ</label>
                <label><input type="radio" name="q9" value="C" data-correct="true" data-explain="Trong trường hợp này, tính từ 'Chăm chỉ' đóng vai trò làm Chủ ngữ để chỉ một đức tính."> C. Tính từ</label>
                <label><input type="radio" name="q9" value="D"> D. Đại từ</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 10: Câu nào dưới đây có bộ phận Vị ngữ là cụm động từ?</div>
            <div class="options">
                <label><input type="radio" name="q10" value="A"> A. Bầu trời trong xanh vời vợi.</label>
                <label><input type="radio" name="q10" value="B" data-correct="true" data-explain="'đang nấu cơm trong bếp' là cụm động từ (động từ chính: nấu)."> B. Mẹ em đang nấu cơm trong bếp.</label>
                <label><input type="radio" name="q10" value="C"> C. Chiếc thước kẻ này bằng nhựa.</label>
                <label><input type="radio" name="q10" value="D"> D. Bạn Lan rất thông minh.</label>
            </div>
        </div>

        <div class="section-title">PHẦN 2: TẬP LÀM VĂN (BIỂU CẢM)</div>

        <div class="question-block">
            <div class="question-text">Câu 11: Mục đích chính của việc viết đoạn văn biểu cảm về một người thân là gì?</div>
            <div class="options">
                <label><input type="radio" name="q11" value="A"> A. Kể lại một câu chuyện cười về người đó.</label>
                <label><input type="radio" name="q11" value="B"> B. Miêu tả chi tiết ngoại hình, quần áo của người đó.</label>
                <label><input type="radio" name="q11" value="C" data-correct="true" data-explain="Văn biểu cảm tập trung vào việc thể hiện thái độ, tình cảm (yêu thương, kính trọng, biết ơn...)."> C. Bày tỏ tình cảm, cảm xúc chân thành đối với người đó.</label>
                <label><input type="radio" name="q11" value="D"> D. Giới thiệu tiểu sử và năm sinh của người đó.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 12: Khi viết đoạn văn nêu tình cảm với người thân, em nên dùng những từ ngữ nào để thể hiện cảm xúc?</div>
            <div class="options">
                <label><input type="radio" name="q12" value="A"> A. Cao lớn, gầy guộc, đen nhánh.</label>
                <label><input type="radio" name="q12" value="B" data-correct="true" data-explain="Đây là các từ ngữ chỉ trạng thái cảm xúc, tình cảm."> B. Yêu quý, kính trọng, biết ơn, nhớ thương.</label>
                <label><input type="radio" name="q12" value="C"> C. Chạy nhảy, đi đứng, ăn uống.</label>
                <label><input type="radio" name="q12" value="D"> D. Hôm qua, hôm nay, ngày mai.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 13: Phần mở đầu của đoạn văn biểu cảm về nhân vật văn học thường có nội dung gì?</div>
            <div class="options">
                <label><input type="radio" name="q13" value="A"> A. Liên hệ bản thân em sẽ làm gì.</label>
                <label><input type="radio" name="q13" value="B" data-correct="true" data-explain="Cần cho người đọc biết em đang định nói về ai và cảm xúc ban đầu là gì."> B. Giới thiệu nhân vật và ấn tượng chung của em về nhân vật đó.</label>
                <label><input type="radio" name="q13" value="C"> C. Kể lại chi tiết cái chết của nhân vật.</label>
                <label><input type="radio" name="q13" value="D"> D. Miêu tả phong cảnh nơi nhân vật sống.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 14: Dòng nào dưới đây là câu văn bộc lộ cảm xúc (không phải câu kể sự việc)?</div>
            <div class="options">
                <label><input type="radio" name="q14" value="A"> A. Bà em năm nay đã sáu mươi tuổi.</label>
                <label><input type="radio" name="q14" value="B"> B. Mỗi sáng, bà đều dậy sớm tập thể dục.</label>
                <label><input type="radio" name="q14" value="C" data-correct="true" data-explain="Sử dụng từ cảm thán 'Chao ôi', 'biết mấy' và từ chỉ tình cảm 'thương' để bộc lộ cảm xúc trực tiếp."> C. Chao ôi, em thương bà biết mấy khi thấy đôi bàn tay chai sần ấy!</label>
                <label><input type="radio" name="q14" value="D"> D. Bà thường kể chuyện cổ tích cho em nghe.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 15: Câu kết đoạn của bài văn biểu cảm về người thân thường dùng để làm gì?</div>
            <div class="options">
                <label><input type="radio" name="q15" value="A"> A. Giới thiệu tên người thân.</label>
                <label><input type="radio" name="q15" value="B"> B. Kể về một kỷ niệm hồi nhỏ.</label>
                <label><input type="radio" name="q15" value="C" data-correct="true" data-explain="Kết đoạn là lúc gói ghém lại cảm xúc và hướng tới tương lai (lời hứa, mong ước)."> C. Khẳng định lại tình cảm và nêu lời hứa hoặc mong ước của em.</label>
                <label><input type="radio" name="q15" value="D"> D. Tả chi tiết khuôn mặt của người thân.</label>
            </div>
        </div>

        <button id="btn-nop" onclick="nopBai()">NỘP BÀI</button>
        <p id="status-log" style="text-align:center; color:#666; font-size:12px; margin-top:10px;"></p>
    </div>

    <script>
        async function initPage() {
            // Key cho môn Tiếng Việt. 
            // Nếu muốn tách riêng bài này, hãy đổi "tv" thành "tv_on_tap" trong database và dòng dưới đây.
            let monKey = "tv"; 
            
            if (typeof db === 'undefined' && typeof firebase !== 'undefined') {
                var db = firebase.firestore();
            }
            try {
                // Kiểm tra trạng thái môn học (đóng/mở)
                const configDoc = await db.collection("CAU_HINH").doc("trang_thai_mon").get();
                if (configDoc.exists && configDoc.data()[monKey] === false) {
                    alert("⛔ BÀI THI ĐANG ĐÓNG!");
                    window.location.href = "Menu.html";
                }
                
                // Lấy thời gian làm bài
                const timeDoc = await db.collection("CAU_HINH").doc("thoi_gian_lam_bai").get();
                if(timeDoc.exists && timeDoc.data()[monKey] > 0) {
                     window.serverTimeLimit = timeDoc.data()[monKey] * 60; 
                }
            } catch (e) { console.log("Lỗi tải cấu hình:", e); }
        }
        
        // Gọi hàm khởi tạo sau khi load trang
        setTimeout(initPage, 500);
    </script>
    
    <script src="core.js"></script>
    <script src="config.js"></script>

</body>
</html>
