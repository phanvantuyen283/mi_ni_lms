<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Tiếng Việt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <div class="menu-top">
            <a href="index.html">⬅ Quay về màn hình chính</a>
        </div>

        <div class="header">
            <div class="info">
                <h2 id="ten-bai-tap">TIẾNG VIỆT - ÔN TẬP TỪ VÀ CÂU</h2>
                <p>Học sinh: <span id="student-display" style="font-weight:bold; color:#0284c7">...</span></p>
            </div>
            <div class="timer">⏱ <span id="timer">00:00</span></div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 1: Từ nào dưới đây viết <u>đúng</u> chính tả?</div>
            <div class="options">
                <label><input type="radio" name="tv1" value="A"> A. Xắp xếp</label>
                <label><input type="radio" name="tv1" value="B" data-correct="true"> B. Sắp xếp</label>
                <label><input type="radio" name="tv1" value="C"> C. Sắp sếp</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 2: Trong câu "Chú mèo mướp đang nằm sưởi nắng", từ nào là từ chỉ hoạt động?</div>
            <div class="options">
                <label><input type="radio" name="tv2" value="A"> A. Chú mèo</label>
                <label><input type="radio" name="tv2" value="B"> B. Sưởi nắng</label>
                <label><input type="radio" name="tv2" value="C" data-correct="true"> C. Nằm</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 3: Câu "Bầu trời trong xanh." thuộc kiểu câu gì?</div>
            <div class="options">
                <label><input type="radio" name="tv3" value="A" data-correct="true"> A. Ai thế nào?</label>
                <label><input type="radio" name="tv3" value="B"> B. Ai làm gì?</label>
                <label><input type="radio" name="tv3" value="C"> C. Ai là gì?</label>
            </div>
        </div>

        <button id="btn-nop" onclick="nopBai()">NỘP BÀI</button>
    </div>

    <script type="module" src="core.js"></script>

</body>
</html>
