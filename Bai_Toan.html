<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Toán</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e0f2fe; padding: 20px; display: flex; justify-content: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; width: 100%; max-width: 600px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 4px solid #fff; }
        
        /* Header & Timer */
        .header { background: #f0f9ff; padding: 15px; border-radius: 12px; border: 2px dashed #bae6fd; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-size: 1.1rem; margin: 0; color: #0284c7; }
        .timer { font-size: 1.5rem; font-weight: 900; color: #dc2626; }
        
        /* Câu hỏi */
        .question-block { background: #fff; border: 2px solid #e2e8f0; padding: 20px; margin-bottom: 20px; border-radius: 12px; }
        .question-text { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; line-height: 1.4; }
        .options label { display: block; padding: 12px; margin-top: 8px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .options label:hover { background: #f0f9ff; border-color: #0284c7; color: #0284c7; }
        .options input { margin-right: 10px; transform: scale(1.3); }

        /* Nút bấm Nộp bài */
        #btn-nop { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 18px; font-weight: 900; color: white; cursor: pointer; background: linear-gradient(to bottom, #38bdf8, #0284c7); box-shadow: 0 6px 0 #075985; transition: all 0.1s; margin-top: 10px; }
        #btn-nop:active { top: 6px; box-shadow: none; transform: translateY(4px); }
        
        /* Popup kết quả */
        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .result-box { background: white; padding: 40px; width: 90%; max-width: 400px; border-radius: 20px; text-align: center; border-top: 8px solid #ea580c; animation: popUp 0.4s ease; }
        .result-score { font-size: 4rem; font-weight: 900; color: #ea580c; margin: 10px 0; }
        
        /* Nút trong Popup */
        .btn-group-result button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; }
        .btn-review { background: #f59e0b; } .btn-continue { background: #0284c7; } .btn-finish { background: #64748b; }
        
        /* Review Mode */
        .res-correct { background-color: #dcfce7 !important; border: 2px solid #22c55e !important; }
        .res-wrong { background-color: #fee2e2 !important; border: 2px solid #ef4444 !important; }
        
        @keyframes popUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div style="margin-bottom:15px"><a href="Menu.html" style="text-decoration:none; color:#64748b; font-weight:bold">⬅ Quay về chọn môn khác</a></div>

        <div class="header">
            <div class="info">
                <h2 id="ten-bai-tap">TOÁN - TUẦN 20 - PHÂN SỐ</h2>
                <p>Học sinh: <span id="student-display" style="font-weight:bold; color:#0284c7">Đang tải...</span></p>
            </div>
            <div class="timer">⏱ <span id="timer">00:00</span></div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 1: Phân số nào dưới đây bằng 1?</div>
            <div class="options">
                <label><input type="radio" name="t1" value="A"> A. 3/4</label>
                <label><input type="radio" name="t1" value="B" data-correct="true"> B. 5/5</label>
                <label><input type="radio" name="t1" value="C"> C. 7/6</label>
                <label><input type="radio" name="t1" value="D"> D. 1/2</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 2: Phân số nào bé hơn 1?</div>
            <div class="options">
                <label><input type="radio" name="t2" value="A" data-correct="true"> A. 4/9</label>
                <label><input type="radio" name="t2" value="B"> B. 8/5</label>
                <label><input type="radio" name="t2" value="C"> C. 10/10</label>
                <label><input type="radio" name="t2" value="D"> D. 6/3</label>
            </div>
        </div>

        <button id="btn-nop">NỘP BÀI</button>
        <p id="status-log" style="text-align:center; color:#666; font-size:12px; margin-top:10px;"></p>
    </div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = { apiKey: "AIzaSyA77lLi_JCLIdR535KEfg3S0_Ge2EorPMo", authDomain: "baikiemtracuoiki.firebaseapp.com", projectId: "baikiemtracuoiki", storageBucket: "baikiemtracuoiki.firebasestorage.app", messagingSenderId: "953819948776", appId: "1:953819948776:web:4e9a017a6c5fc10ed28b5d" };
        
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            document.getElementById("status-log").innerText = "✅ Đã kết nối hệ thống chấm điểm.";
        } catch (e) {
            document.getElementById("status-log").innerText = "⚠️ Lỗi kết nối: " + e.message;
        }

        // Hiện tên học sinh
        const studentName = localStorage.getItem("hocSinhLop4A");
        document.getElementById("student-display").innerText = studentName ? studentName : "Chưa đăng nhập";

        // Đồng hồ
        let seconds = 0;
        let timerInterval = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById("timer").innerText = `${m}:${s}`;
        }, 1000);

        // --- BẮT SỰ KIỆN NÚT BẤM ---
        const btnNop = document.getElementById("btn-nop");
        if(btnNop) {
            btnNop.addEventListener("click", xuLyNopBai);
        }

        async function xuLyNopBai() {
            // 1. Hiệu ứng đang xử lý
            btnNop.disabled = true;
            btnNop.innerText = "ĐANG CHẤM...";
            btnNop.style.opacity = "0.7";
            clearInterval(timerInterval);

            // 2. Chấm điểm
            const tieuDe = document.getElementById("ten-bai-tap").innerText;
            const questionBlocks = document.querySelectorAll(".question-block");
            let score = 0;
            let total = questionBlocks.length;

            questionBlocks.forEach(block => {
                const inputs = block.querySelectorAll("input[type='radio']");
                let isCorrect = false;
                inputs.forEach(input => {
                    if (input.checked && input.getAttribute("data-correct") === "true") isCorrect = true;
                });
                if (isCorrect) score++;
            });

            const diemSo = (total > 0) ? (score / total) * 10 : 0;

            // 3. Gửi Firebase
            try {
                if (studentName) {
                    const q = db.collection("KET_QUA_TONG_HOP").where("hoc_sinh", "==", studentName).where("bai_tap", "==", tieuDe);
                    const snapshot = await q.get();

                    let isNewRecord = false; 
                    let oldScore = -1;

                    if (!snapshot.empty) {
                        const oldDoc = snapshot.docs[0];
                        oldScore = oldDoc.data().diem;
                        if (diemSo > oldScore) {
                            await db.collection("KET_QUA_TONG_HOP").doc(oldDoc.id).set({
                                hoc_sinh: studentName, bai_tap: tieuDe, diem: diemSo, 
                                so_cau_dung: score, tong_so_cau: total, 
                                thoi_gian_lam: seconds, ngay_nop: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            isNewRecord = true;
                        }
                    } else {
                        await db.collection("KET_QUA_TONG_HOP").add({
                            hoc_sinh: studentName, bai_tap: tieuDe, diem: diemSo, 
                            so_cau_dung: score, tong_so_cau: total, 
                            thoi_gian_lam: seconds, ngay_nop: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        isNewRecord = true;
                    }

                    // --- ĐOẠN MÃ MỚI: KIỂM TRA QUYỀN XEM ĐÁP ÁN ---
                    let allowReview = false; 
                    const configSnap = await db.collection("CAU_HINH").doc("trang_thai_mon").get();
                    
                    // Kiểm tra nếu giáo viên đã bật (true) thì mới cho xem
                    if(configSnap.exists && configSnap.data().xem_dap_an === true) {
                        allowReview = true;
                    }

                    hienThiKetQua(diemSo, score, total, isNewRecord, oldScore, allowReview);
                    banPhaoGiay(diemSo);
                    docLoiChuc(studentName, diemSo);
                } else {
                    alert(`Bạn chưa đăng nhập. Điểm: ${diemSo.toFixed(1)}`);
                    btnNop.disabled = false;
                    btnNop.innerText = "NỘP BÀI";
                }
            } catch (e) {
                alert("Lỗi gửi điểm: " + e.message);
                btnNop.disabled = false;
                btnNop.innerText = "NỘP BÀI LẠI";
            }
        }

        // Hàm hiển thị (Có thêm tham số allowReview)
        function hienThiKetQua(diem, dung, tong, isNewRecord, oldScore, allowReview) {
            let msgTitle = isNewRecord || oldScore === -1 ? "✅ NỘP BÀI THÀNH CÔNG!" : `⚠️ CHƯA VƯỢT QUA KỶ LỤC CŨ (${oldScore.toFixed(1)})`;
            
            // Logic ẩn/hiện nút
            let btnReviewHtml = allowReview ? `<button class="btn-review" id="btn-review">🔍 Xem lại bài</button>` : ``;

            const div = document.createElement("div");
            div.id = "result-popup";
            div.className = "result-overlay";
            div.style.display = "flex";
            div.innerHTML = `
                <div class="result-box">
                    <h3>${msgTitle}</h3>
                    <div class="result-score">${diem.toFixed(1)}</div>
                    <div class="result-info">Đúng <strong>${dung}/${tong}</strong> câu.</div>
                    <div class="btn-group-result">
                        ${btnReviewHtml}
                        <button class="btn-continue" onclick="window.location.href='Menu.html'">➜ Làm môn khác</button>
                    </div>
                </div>`;
            document.body.appendChild(div);
            
            // Chỉ gán sự kiện nếu nút tồn tại
            if(allowReview) {
                document.getElementById("btn-review").addEventListener("click", xemLaiBai);
            }
        }

        function xemLaiBai() {
            document.getElementById("result-popup").style.display = "none";
            document.getElementById("btn-nop").style.display = "none";
            document.querySelectorAll("input").forEach(i => i.disabled = true);
            document.querySelectorAll("input[data-correct='true']").forEach(i => i.parentElement.classList.add("res-correct"));
            document.querySelectorAll("input:checked:not([data-correct='true'])").forEach(i => i.parentElement.classList.add("res-wrong"));
            window.scrollTo(0,0);
            
            const btn = document.createElement("button");
            btn.innerText = "⬅ Quay về Menu";
            btn.style.marginTop = "20px";
            btn.style.background = "#64748b";
            btn.style.color = "white";
            btn.style.padding = "15px";
            btn.style.border = "none";
            btn.style.borderRadius = "10px";
            btn.onclick = () => window.location.href = "Menu.html";
            document.querySelector(".quiz-container").appendChild(btn);
        }

        function banPhaoGiay(diem) {
            if (diem < 5) return;
            var duration = 2000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function docLoiChuc(ten, diem) {
            if ('speechSynthesis' in window) {
                let msg = diem >= 9 ? `Xuất sắc! Chúc mừng ${ten}` : `Bạn ${ten} được ${diem} điểm`;
                let ut = new SpeechSynthesisUtterance(msg);
                ut.lang = 'vi-VN';
                window.speechSynthesis.speak(ut);
            }
        }
    </script>
</body>
</html>
