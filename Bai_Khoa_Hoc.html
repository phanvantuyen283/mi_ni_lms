<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoa học 4 - Thế Giới Nấm</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0fdf4; padding: 20px; display: flex; justify-content: center; min-height: 100vh; margin: 0; }
        .quiz-container { background: white; width: 100%; max-width: 750px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 4px solid #fff; }
        .header { background: #dcfce7; padding: 15px; border-radius: 12px; border: 2px dashed #15803d; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; z-index: 10; }
        .header h2 { font-size: 0.9rem; margin: 0; color: #166534; text-transform: uppercase; }
        .timer { font-size: 1.2rem; font-weight: 900; color: #dc2626; }
        .question-block { background: #fff; border: 2px solid #e2e8f0; padding: 20px; margin-bottom: 18px; border-radius: 12px; transition: 0.2s; }
        .question-block:hover { border-color: #4ade80; }
        .security-quest { border: 3px solid #e11d48; background-color: #fff1f2; }
        .question-text { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: #1e293b; line-height: 1.5; }
        .options label { display: block; padding: 12px; margin-top: 8px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .options label:hover { background: #dcfce7; border-color: #15803d; font-weight: 500; color: #14532d; }
        .options input { margin-right: 10px; transform: scale(1.3); }
        #btn-nop { width: 100%; padding: 18px; border: none; border-radius: 12px; font-size: 20px; font-weight: 900; color: white; cursor: pointer; background: linear-gradient(to bottom, #22c55e, #15803d); box-shadow: 0 6px 0 #14532d; transition: all 0.1s; margin-top: 15px; }
        #btn-nop:active { top: 6px; box-shadow: none; transform: translateY(4px); }
        .explain-box { display: none; margin-top: 15px; padding: 12px; background-color: #f0fdf4; border-left: 4px solid #15803d; color: #14532d; font-size: 0.95rem; line-height: 1.5; border-radius: 4px; animation: fadeIn 0.5s; }
        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .result-box { background: white; padding: 40px; width: 90%; max-width: 450px; border-radius: 20px; text-align: center; border-top: 8px solid #15803d; }
        .result-score { font-size: 5rem; font-weight: 900; color: #15803d; margin: 10px 0; }
        .btn-group-result button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
        .btn-review { background: #f59e0b; } .btn-continue { background: #0284c7; } .btn-finish { background: #64748b; }
        .res-correct { background-color: #dcfce7 !important; border: 2px solid #22c55e !important; }
        .res-wrong { background-color: #fee2e2 !important; border: 2px solid #ef4444 !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div style="margin-bottom:10px"><a href="Menu.html" style="text-decoration:none; color:#64748b; font-weight:bold; font-size:13px">⬅ Quay về Menu</a></div>
        <div class="header">
            <div class="info">
                <h2 id="ten-bai-tap">KHOA HỌC - KHÁM PHÁ THẾ GIỚI NẤM</h2>
                <p style="margin:5px 0 0 0; font-size:11px">Học sinh: <b id="student-display">...</b></p>
            </div>
            <div class="timer">⏱ <b id="timer">00:00</b></div>
        </div>

        <div class="question-block security-quest"></div>

        <div class="question-block">
            <div class="question-text">Câu 1: Nấm thường thích sống ở môi trường nào nhất?</div>
            <div class="options">
                <label><input type="radio" name="c1" value="A"> A. Nơi khô ráo, nhiều ánh nắng.</label>
                <label><input type="radio" name="c1" value="B" data-correct="true" data-explain="Nấm ưa thích nơi ẩm ướt. Đó là lý do sau cơn mưa nấm thường mọc nhiều."> B. Nơi ẩm ướt.</label>
                <label><input type="radio" name="c1" value="C"> C. Nơi có nhiệt độ rất cao.</label>
                <label><input type="radio" name="c1" value="D"> D. Dưới đáy sông.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 2: Hình dạng của nấm như thế nào?</div>
            <div class="options">
                <label><input type="radio" name="c2" value="A"> A. Tất cả nấm đều hình tròn.</label>
                <label><input type="radio" name="c2" value="B"> B. Tất cả nấm đều hình cái ô.</label>
                <label><input type="radio" name="c2" value="C" data-correct="true" data-explain="Thế giới nấm rất đa dạng: Nấm mũ hình cái ô, mộc nhĩ hình cái tai, nấm kim châm hình sợi..."> C. Rất đa dạng: hình cái ô, cái tai, sợi chỉ...</label>
                <label><input type="radio" name="c2" value="D"> D. Chỉ có hình vuông.</label>
            </div>
        </div>

        <div class="question-block">
            <div class="question-text">Câu 3: Những loại nấm có màu sắc sặc sỡ (ví dụ đỏ đốm trắng) thường là nấm gì?</div>
            <div class="options">
                <label><input type="radio" name="c3" value="A"> A. Nấm rất ngon.</label>
                <label><input type="radio" name="c3" value="B" data-correct="true" data-explain="Trong tự nhiên, màu sắc sặc sỡ thường là tín hiệu cảnh báo nguy hiểm."> B. Nấm độc.</label>
